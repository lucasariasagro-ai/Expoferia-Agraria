<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expoferia Agraria 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap">
<style>
:root{--bg:#f2f7ee;--sf:#fff;--ink:#16241a;--mut:#56685b;--ln:#d5e0cd;--pri:#1f7a33;--onpri:#fff;--act:#14532d;--onact:#fff;--lime:#c6ea3a;--sh:0 2px 4px rgba(22,36,26,.05),0 14px 30px -14px rgba(31,122,51,.35);
--y1:#2f9e44;--y2:#1c7ed6;--y3:#f08c00;--y4:#e03131;--y5:#7048e8;--y6:#0c8599;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a12;--sf:#16271c;--ink:#ecf4e8;--mut:#9bb0a1;--ln:#2a4130;--pri:#46b45c;--onpri:#0b1a0f;--act:#c6ea3a;--onact:#10200f;--sh:0 10px 28px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0e1a12;--sf:#16271c;--ink:#ecf4e8;--mut:#9bb0a1;--ln:#2a4130;--pri:#46b45c;--onpri:#0b1a0f;--act:#c6ea3a;--onact:#10200f;--sh:0 10px 28px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.w{max-width:1000px;margin:0 auto}
header{padding:36px 24px 44px;background:linear-gradient(120deg,#0f5a26 0%,#2a9a3c 55%,#9fd62b 100%);color:#fff;border-radius:0 0 32px 32px}
header .w{display:flex;align-items:center;gap:24px}
.logo{width:112px;height:112px;flex:none;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 5px rgba(255,255,255,.35),0 16px 34px -10px rgba(0,0,0,.45)}
h1{margin:0;font-weight:800;font-size:clamp(2.1rem,7vw,3.8rem);line-height:1.02;letter-spacing:-.03em}
header p{margin:12px 0 0;max-width:56ch;color:rgba(255,255,255,.92);font-size:1.02rem}
main{padding:28px 24px 56px}
.bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:6px}
input[type=search]{flex:1 1 280px;font:inherit;font-size:1.02rem;padding:14px 18px;border:2px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
input[type=search]:focus{outline:3px solid var(--lime);border-color:var(--pri)}
.seg{display:flex;border:2px solid var(--pri);border-radius:14px;overflow:hidden;background:var(--sf);box-shadow:var(--sh)}
button{font:inherit;cursor:pointer;color:var(--ink)}
.seg button{border:0;background:transparent;padding:12px 20px;color:var(--pri);font-weight:700}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--onpri)}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.lab{font-size:.85rem;color:var(--mut);margin:18px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 16px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--act);border-color:var(--onact)}
#yc button[data-v="1"]{border-color:var(--y1)}#yc button[data-v="2"]{border-color:var(--y2)}#yc button[data-v="3"]{border-color:var(--y3)}#yc button[data-v="4"]{border-color:var(--y4)}#yc button[data-v="5"]{border-color:var(--y5)}#yc button[data-v="6"]{border-color:var(--y6)}
#yc button[data-v="1"][aria-pressed=true]{background:var(--y1)}#yc button[data-v="2"][aria-pressed=true]{background:var(--y2)}#yc button[data-v="3"][aria-pressed=true]{background:var(--y3);color:#1b1100}#yc button[data-v="4"][aria-pressed=true]{background:var(--y4)}#yc button[data-v="5"][aria-pressed=true]{background:var(--y5)}#yc button[data-v="6"][aria-pressed=true]{background:var(--y6)}
.cnt{margin:22px 0 12px;color:var(--mut);font-weight:600}
.y1{--yc:var(--y1)}.y2{--yc:var(--y2)}.y3{--yc:var(--y3)}.y4{--yc:var(--y4)}.y5{--yc:var(--y5)}.y6{--yc:var(--y6)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-top:6px solid var(--yc,var(--pri));border-radius:18px;padding:16px 20px 18px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:1.18rem;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.sub{display:inline-block;background:color-mix(in srgb,var(--yc,var(--pri)) 16%,var(--sf));color:var(--ink);border:1px solid var(--yc,var(--pri));border-radius:99px;padding:2px 12px;font-size:.84rem;font-weight:700;margin-bottom:8px}
.card dl{margin:0;font-size:.93rem}
.card dt{font-weight:700;display:inline}
.card dd{display:inline;margin:0;color:var(--mut)}
.card div.r{margin:3px 0}
.card p{color:var(--mut)}
.hs{margin:10px 0 0;padding:0;list-style:none}
.hs li{padding:7px 0;border-top:1px dashed var(--ln);font-size:.92rem;color:var(--mut)}
.hs b{color:var(--yc,var(--pri));font-variant-numeric:tabular-nums}
details{margin-top:8px;font-size:.88rem;color:var(--mut)}
summary{cursor:pointer;font-weight:700;color:var(--act)}
.tbd{color:var(--mut);font-style:italic}
.blk{margin:26px 0 6px;font-size:1.4rem;font-weight:800;display:inline-block;padding:4px 16px;border-radius:99px;background:var(--pri);color:var(--onpri)}
.row{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:12px 14px;margin-top:8px;background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--yc,var(--ln));border-radius:12px}
.row .t{font-weight:800;color:var(--yc,var(--pri));font-variant-numeric:tabular-nums}
.row small{display:block;color:var(--mut)}
.empty{padding:36px 20px;text-align:center;color:var(--mut);background:var(--sf);border:2px dashed var(--ln);border-radius:16px}
mark{background:var(--lime);color:#16241a;border-radius:3px;padding:0 2px}
@media(max-width:600px){header{padding:26px 18px 32px;border-radius:0 0 24px 24px}main{padding:22px 16px 44px}.logo{width:76px;height:76px}header .w{gap:14px}.row{grid-template-columns:1fr;gap:2px}}
</style>
</head>

function nz(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
