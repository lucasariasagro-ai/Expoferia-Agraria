function match(d,q){
 if(yr&&years(d.c).indexOf(yr)<0)return false;
 if(favOnly&&!fav[d.k])return false;
 if(!q)return true;
 const h=d.h.map(x=>x[0]+" "+x[1]).join(" ");
 const t=scope=="act"?d.a:scope=="asig"?d.m+" "+d.c:[d.m,d.c,d.a,d.r,d.l,d.p||"",h].join(" ");
 return nz(t).indexOf(q)>=0}
function chips(id,list,get,set){
 $(id).innerHTML=list.map(x=>`<button aria-pressed="${get()==x[0]}" data-v="${x[0]}">${x[1]}</button>`).join("");

const sel=(id,list,isOn,on)=>{$(id).innerHTML=list.map(x=>`<button aria-pressed="${isOn(x[0])}" data-v="${x[0]}">${x[1]}</button>`).join("");$(id).onclick=e=>{const b=e.target.closest("button");if(b){on(b.dataset.v);if(!view||view==3)view=1;draw()}}};
function card(d,q,i){
 const hs=d.h.length?`<ul class="hs">${d.h.map(x=>`<li>${ic("clock",16)}<span><b>${esc(x[0])}</b>${x[1]?" · "+esc(x[1]):""}</span></li>`).join("")}</ul>`:`<p class="tbd">${ic("clock",16)} Horario a definir</p>`;
 return `<article class="card ${yc(d)}" style="--i:${Math.min(i,12)}"><div class="top"><span class="ic">${ic(icon(d),30)}</span><div><span class="sub">${hl(d.m,q)} · ${esc(d.c)}</span><h3>${hl(d.a,q)}</h3></div></div><div class="r">${ic("user",16)}<span>${hl(d.r,q)}</span></div><div class="r">${ic("pin",16)}<span>${hl(d.l,q)}</span></div>${hs}${d.p?`<details><summary>${ic("users",16)} Estudiantes</summary>${esc(d.p)}</details>`:""}</article>`}
function agenda(L,q){
 const G={};
 const add=(k,lab,it)=>{(G[k]=G[k]||{lab,items:[]}).items.push(it)};
 L.forEach(d=>{
  if(!d.h.length)add(2e4,"Horario a definir",{d,t:"",w:""});
  d.h.forEach(x=>{const t=x[0];let k,lab;
   if(/^\d/.test(t)){k=Math.floor(mins(t)/60)*60;lab=String(k/60).padStart(2,"0")+":00"}
   else if(/ma[nñ]ana/i.test(t)){k=600;lab="Turno mañana"}
   else{k=1e4;lab="Hasta el cierre"}
   add(k,lab,{d,t,w:x[1]})})});
 const ks=Object.keys(G).map(Number).sort((a,b)=>a-b);
 let n=0;
 return `<div class="tl">${ks.map(k=>`<section class="tg"><div class="tt"><span class="dot"></span><h2>${G[k].lab}</h2></div><div class="tb">${G[k].items.sort((a,b)=>mins(a.t)-mins(b.t)).map(it=>`<div class="bk ${yc(it.d)}" style="--i:${Math.min(n++,12)}"><span class="ic s">${ic(icon(it.d),22)}</span><div><b>${hl(it.d.a,q)}</b><small>${it.t?esc(it.t)+" · ":""}${hl(it.d.m,q)} ${esc(it.d.c)}</small>${it.w?`<small>${esc(it.w)}</small>`:""}<small>${ic("pin",13)} ${hl(it.d.l,q)}</small></div></div>`).join("")}</div></section>`).join("")}</div>`}
function draw(anim=true){
 const q=nz($("q").value.trim()),L=D.filter(d=>match(d,q));
 $("v1").setAttribute("aria-pressed",view==1);$("v2").setAttribute("aria-pressed",view==2);$("v3").setAttribute("aria-pressed",view==3);
 sel("sc",[["all","Todo"],["act","Actividad"],["asig","Asignatura"]],v=>v=="all"?(scope=="all"&&!yr):scope==v,v=>{if(v=="all"){scope="all";yr=0}else scope=scope==v?"all":v});
 sel("yc",[1,2,3,4,5,6].map(n=>[n,n+"°"]),v=>yr==v,v=>{yr=yr==+v?0:+v});
 if(view==3){$("cnt").textContent="";$("out").className="";$("out").innerHTML=planHTML();planBind();return}
 if(!view){$("cnt").textContent="";$("out").className="";$("out").innerHTML=`<div class="empty">Tocá <b>Actividades</b> u <b>Horarios</b> para ver el programa</div>`;return}

 const out=$("out");out.className=anim?"anim":"";
 if(!L.length){out.innerHTML=`<div class="empty">${favOnly&&!q?"Todavía no marcaste favoritas. Tocá la estrella de una actividad para guardarla.":"No hay actividades con esa búsqueda. Probá con otra palabra o cambiá el año."}</div>`;return}
 out.innerHTML=view==1?`<div class="grid">${L.map((d,i)=>card(d,q,i)).join("")}</div>`:agenda(L,q)}
$("q").oninput=()=>{if((!view||view==3)&&$("q").value.trim())view=1;draw()};

const DIA="2026-11-15";
const rng=t=>{let m=t.match(/(\d{1,2}):(\d\d)\s*[–-]\s*(\d{1,2}):(\d\d)/);if(m)return[+m[1]*60+ +m[2],+m[3]*60+ +m[4]];m=t.match(/^(\d{1,2}):(\d\d)/);if(m){const s=+m[1]*60+ +m[2];return[s,s+30]}if(/cierre/i.test(t))return[870,1020];if(/ma[nñ]ana/i.test(t)){const h=t.match(/hasta (\d{1,2}):(\d\d)/);return[660,h?+h[1]*60+ +h[2]:780]}return null};

function ahora(){
 const b=$("now"),n=new Date(),sim=location.hash.match(/^#hora(\d\d)(\d\d)$/);
 const dia=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
 if(!sim&&dia!==DIA){b.hidden=true;return}
 const m=sim?+sim[1]*60+ +sim[2]:n.getHours()*60+n.getMinutes();
 const on=SL.filter(x=>x.s<=m&&m<x.e),nx=SL.filter(x=>x.s>m&&x.s<=m+60).sort((a,c)=>a.s-c.s);
 const it=x=>`<div class="nw ${yc(x.d)}"><span class="ic s">${ic(icon(x.d),20)}</span><div><b>${esc(x.d.a)}</b><small>${esc(x.t)} · ${esc(x.d.l)}</small></div></div>`;
 const grp=(t,a)=>a.length?`<div class="nl">${t}</div><div class="ng">${a.slice(0,6).map(it).join("")}</div>`:"";
 let h=`<div class="nh"><span class="live"></span><h2>Ahora en la expo</h2><span class="nt">${hm(m)}</span></div>`;
 if(m>=1020)h+=`<p class="nm">La expo ya terminó. ¡Gracias por visitarnos!</p>`;
 else{h+=grp("En curso",on)+grp("En la próxima hora",nx);if(!on.length&&!nx.length)h+=`<p class="nm">No hay turnos programados en este momento. Mirá todas las actividades más abajo.</p>`}
 b.innerHTML=h;b.hidden=false}
