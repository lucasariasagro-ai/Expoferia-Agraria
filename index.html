function agenda(L,q){
 const G={};
 const add=(k,lab,it)=>{(G[k]=G[k]||{lab,items:[]}).items.push(it)};
 L.forEach(d=>{
  if(!d.h.length)add(2e4,"Horario a definir",{d,t:"",w:""});
  d.h.forEach(x=>{const t=x[0];let k,lab;
   if(/^\d/.test(t)){k=Math.floor(mins(t)/60)*60;lab=String(k/60).padStart(2,"0")+":00"}
   else if(/ma[nñ]ana/i.test(t)){k=600;lab="Turno mañana"}
   else{k=1e4;lab="Hasta el cierre"}
   add(k,lab,{d,t,w:x[1]})})});
 const ks=Object.keys(G).map(Number).sort((a,b)=>a-b);
 let n=0;
 return `<div class="tl">${ks.map(k=>`<section class="tg"><div class="tt"><span class="dot"></span><h2>${G[k].lab}</h2></div><div class="tb">${G[k].items.sort((a,b)=>mins(a.t)-mins(b.t)).map(it=>`<div class="bk ${yc(it.d)}" style="--i:${Math.min(n++,12)}"><span class="ic s">${ic(icon(it.d),22)}</span><div><b>${hl(it.d.a,q)}</b><small>${it.t?esc(it.t)+" · ":""}${hl(it.d.m,q)} ${esc(it.d.c)}</small>${it.w?`<small>${esc(it.w)}</small>`:""}<small>${ic("pin",13)} ${hl(it.d.l,q)}</small></div></div>`).join("")}</div></section>`).join("")}</div>`}

 b.innerHTML=h;b.hidden=false}

let planLocal="";try{planLocal=localStorage.getItem("expo-plano")||""}catch(e){}
function planHTML(){
 const src=PLANO||planLocal;
 const btn=`<label class="pbtn">${ic("map",18)} ${src?"Cambiar plano":"Cargar plano"}<input type="file" accept="image/*" id="pf" hidden></label>`;
 if(!src)return `<div class="empty plan0">${ic("map",40)}<h3>Plano de la escuela</h3><p>Todavía no hay un plano cargado.</p>${btn}</div>`;
 return `<figure class="plan"><div class="pz" id="pz"><img src="${src}" alt="Plano de la escuela"></div><figcaption><span>Tocá el plano para ampliarlo</span>${PLANO?"":btn}</figcaption></figure>${PLANO?"":'<p class="phint">Este plano se guarda solo en este dispositivo.</p>'}`}
function planBind(){
 const f=$("pf");
 if(f)f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);planLocal=c.toDataURL("image/jpeg",.85);try{localStorage.setItem("expo-plano",planLocal)}catch(e){}draw()};im.src=r.result};r.readAsDataURL(file)};
 const z=$("pz");if(z)z.onclick=()=>z.classList.toggle("big")}
ahora();setInterval(ahora,30000);addEventListener("hashchange",ahora);
draw();
$("fl").src=$("spl").src;
$("splash").onclick=function(){this.classList.add("hide")};
</script>
<script>
(function(){
var h=document.querySelector("header"),lg=h.querySelector(".logo"),il=h.querySelector(".ilogo");
il.src=lg.src;
function medir(){
 var was=h.classList.contains("loop");
 var hr=h.getBoundingClientRect(),lr=lg.getBoundingClientRect();
 if(!hr.width||!lr.width)return;
 var F=Math.max(80,Math.min(hr.height-28,hr.width-40));
 h.style.setProperty("--F",F+"px");
 h.style.setProperty("--sx",(lr.left+lr.width/2-hr.left-hr.width/2)+"px");
 h.style.setProperty("--sy",(lr.top+lr.height/2-hr.top-hr.height/2)+"px");
 h.style.setProperty("--s0",(lr.width/F).toFixed(4));
}
medir();addEventListener("resize",medir);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(medir);
var ok=false;
function go(){if(ok)return;ok=true;medir();h.classList.add("loop")}
var sp=document.getElementById("splash");
if(!sp)go();
else{
 sp.addEventListener("animationend",function(e){if(e.animationName==="splashOut")go()});
 setTimeout(go,4200);
}
})();
</script>
